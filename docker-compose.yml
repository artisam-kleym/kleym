# Local development dependencies. SPEC.md §9.2.
#
# There is deliberately NO object storage service here. The only file Kleym
# produces is the secrets CSV, generated in the browser and never uploaded.
# Adding storage would create a place for secrets to accidentally land (§2.2).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kleym
      POSTGRES_PASSWORD: kleym
      POSTGRES_DB: kleym
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kleym']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
