name: CI

on:
  # EVERY pull request, whatever it targets.
  #
  # This was `branches: [develop, main]`, which silently gave no CI at all to a
  # PR stacked on another branch — and GitHub still reported it MERGEABLE CLEAN,
  # because "no required checks failed" and "no checks ran" look identical from
  # the outside. A stacked PR is exactly the one worth checking: it carries two
  # changes at once.
  pull_request:
  push:
    branches: [develop, main]

# Integration tests are deliberately absent. AGENT.md §7.2 forbids tests that
# submit to the public network, and the testnet spike depends on Horizon being
# reachable, so it runs on a schedule rather than per-commit (§7.3).

jobs:
  concurrency:
    name: concurrency guarantees (real Postgres)
    runs-on: ubuntu-latest

    # These are the guarantees that fail by returning 200: an idempotency key
    # that replays another user's response, a campaign that registers more
    # links than it declares, a campaign reading ACTIVE while some of its links
    # have no on-chain entry. None is visible to typecheck, lint or a unit test
    # — all need a real database and real concurrent transactions, so this job
    # has one. It is not the testnet integration suite §7.3 defers: no network.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kleym
          POSTGRES_PASSWORD: kleym
          POSTGRES_DB: kleym
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kleym"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The rate limiter is one of the things under test, and it fails CLOSED —
      # without a real Redis every request would be denied and the checks would
      # pass for the wrong reason.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kleym:kleym@localhost:5432/kleym
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Verify idempotency and link-limit concurrency
        run: pnpm verify:concurrency

      - name: Verify API keys, rate limiting and ownership
        run: pnpm verify:api-keys

      - name: Verify batch lifecycle
        run: pnpm verify:batches

      - name: Verify claim resolve, limits and ledger authority
        run: pnpm verify:claims

      - name: Verify the sponsor pool, failover and alerting
        run: pnpm verify:sponsors

      - name: Verify email delivery and OTP
        run: pnpm verify:email

      - name: Verify campaign list and history ownership, filters and ordering
        run: pnpm verify:campaign-list

      - name: Verify the dashboard is scoped, claimed-only and bounded
        run: pnpm verify:dashboard

      - name: Verify reconciliation and the expiry sweep
        run: pnpm verify:reconcile

      - name: Verify reclaim after expiry
        run: pnpm verify:reclaim
      - name: Verify the stranded ephemeral account monitor
        run: pnpm verify:stranded

      - name: Verify the admin area and audit logging
        run: pnpm verify:admin

      - name: Verify the campaign detail page is bounded at MAX_LINKS_PER_CAMPAIGN
        run: pnpm verify:campaign-detail

      - name: Verify user provisioning by invitation
        run: pnpm verify:invitations

      - name: Verify organisations, memberships and roles
        run: pnpm verify:organisations

      - name: Verify delivery retention and erasure
        run: pnpm verify:privacy

      - name: Verify dual control
        run: pnpm verify:approvals

      - name: Verify compliance hooks (screening fail-closed, attestation, regulator export)
        run: pnpm verify:compliance
      - name: Verify observability (traces, forced-condition metrics, status page)
        run: pnpm verify:observability

      - name: Verify the write API, webhooks and the SDK
        run: pnpm verify:write-api

      - name: Verify the audit chain, checkpoints, concurrency and signed export
        run: pnpm verify:audit-chain

      # Last, so the database the suites above populated is what gets dumped,
      # restored into a clean database, and questioned. A backup check that
      # only looks for a file is not one.
      - name: Verify a backup by restoring it
        env:
          RESTORE_DATABASE_URL: postgresql://kleym:kleym@localhost:5432/kleym_restore
        run: |
          # The runner ships the Postgres 16 client; the service is 17, and
          # pg_dump refuses to dump a newer server. Match the client first.
          # The runner's PGDG entry does not carry 17 in its cached index, so
          # the repo is (re)declared and the index refreshed before installing.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-17
          export PATH=/usr/lib/postgresql/17/bin:$PATH
          pg_dump --version
          PGPASSWORD=kleym psql -h localhost -U kleym -d kleym -c 'CREATE DATABASE kleym_restore'
          pnpm verify:backup

  e2e:
    name: CSV gate (real browser)
    runs-on: ubuntu-latest

    # Also runs e2e/claim-page.spec.ts — SPEC.md §10.7 and §10.8, which #6
    # explicitly left unticked because there was no fragment reader to exercise.
    #
    # SPEC.md §10.11 says the Continue button must be unreachable until the CSV
    # download has fired, and the issue is explicit that this be verified by a
    # browser rather than by reading the component. "The button is disabled" is
    # a claim about a rendered page: a component can be right and the page still
    # let a keyboard or a dispatched event through.
    #
    # No network beyond localhost. The two Horizon-backed lookups are stubbed in
    # the test, so this is not the testnet suite AGENT.md §7.2 defers.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kleym
          POSTGRES_PASSWORD: kleym
          POSTGRES_DB: kleym
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kleym"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: production
      APP_URL: http://127.0.0.1:3210
      DATABASE_URL: postgresql://kleym:kleym@localhost:5432/kleym
      REDIS_URL: redis://localhost:6379
      STELLAR_NETWORK: testnet
      HORIZON_URL: https://horizon-testnet.stellar.org
      NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015'
      EMAIL_FROM: noreply@kleym.test
      RESEND_API_KEY: re_test_placeholder
      SEED_ADMIN_USERNAME: e2e
      E2E_USERNAME: e2e

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Generated per run and never printed. A fixed password in a workflow file
      # is a real credential the day someone points this at a real database.
      # The seeded account and the login the tests use are the same one, so the
      # value is generated once rather than set twice and kept in sync by hand.
      - name: Generate run secrets
        run: |
          PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$PASSWORD"
          echo "SESSION_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "AUDIT_SIGNING_SEED=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "SEED_ADMIN_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      # A throwaway keypair. The sponsor key is a real secret in production and
      # must never be one CI knows.
      - name: Generate throwaway sponsor key
        run: |
          pnpm exec tsx -e "
            import { Keypair } from '@stellar/stellar-sdk'
            const k = Keypair.random()
            console.log('SPONSOR_PUBLIC_KEY=' + k.publicKey())
            console.log('SPONSOR_SECRET_KEY=' + k.secret())
          " >> "$GITHUB_ENV"

      - name: Apply migrations
        run: pnpm db:deploy

      # ALLOW_PROD_SEED because NODE_ENV=production here — the seed script
      # refuses otherwise, which is correct: this is a throwaway service
      # container, and the guard exists so a real database is never seeded by
      # accident.
      - name: Seed the test account
        run: ALLOW_PROD_SEED=true pnpm db:seed

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run
        run: pnpm test:e2e

      # SPEC.md §10, issue #17. Playwright brings its own server up and down,
      # so this starts one of its own against the build that already exists.
      #
      # It does NOT fail the job on a criterion that was merely not executed
      # here — nothing in CI touches testnet, so criteria 1-3 correctly report
      # as unexecuted rather than passing. It DOES fail on the header audit,
      # which is fully executable and is the part that silently rots.
      - name: SPEC §10 acceptance matrix and header audit
        run: |
          # The server's own log is captured so criterion 7 — no fragment-derived
          # value in any log line — is EXECUTED here rather than deferred to a
          # human. It is a regression-prone property and belongs in CI.
          NODE_ENV=production pnpm start -p 3211 -H 127.0.0.1 > /tmp/kleym-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3211/api/health >/dev/null && break
            sleep 1
          done
          # A server that never came up must read as "the server never came
          # up", not as a page of criteria failures — this output is what
          # someone reads when deciding whether to release.
          curl -sf http://127.0.0.1:3211/api/health >/dev/null || {
            echo '::error::the server did not answer /api/health within 60s; its log follows'
            cat /tmp/kleym-server.log
            exit 1
          }
          BASE_URL=http://127.0.0.1:3211 SERVER_LOG=/tmp/kleym-server.log pnpm acceptance

      - name: Batch path under load
        # A hang here once cost six hours; a bounded step turns it into a loud failure.
        timeout-minutes: 15
        run: pnpm loadtest

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  check:
    name: typecheck · lint · build · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # No environment is provided on purpose. Config validation is deferred to
      # first access precisely so the build needs no secrets — if this step ever
      # starts requiring them, that decoupling has regressed.
      - name: Build
        run: pnpm build

      - name: Audit
        run: pnpm audit --audit-level=moderate

      # SPEC.md §6.6, issue #51. /api/v1 gained write endpoints, and the reason
      # it was read-only has not changed: a seed must never reach a server
      # (AGENT.md §1). So every write route must (a) go through the write
      # preamble and (b) run `guardRequestBody` on its body, visibly, before
      # any schema — the failure mode this codebase has met is a guard that
      # exists but is not wired to every route. And no v1 schema may name a
      # field a seed would go in.
      - name: Every public write endpoint runs the seed guard
        run: |
          fail=0
          for FILE in $(grep -rlE "^export (async )?function (POST|PUT|PATCH|DELETE)" src/app/api/v1/); do
            if ! grep -q "requireApiWriter(" "$FILE"; then
              echo "::error file=$FILE::a v1 write route does not use requireApiWriter (lib/api/v1.ts)"; fail=1
            fi
            if ! grep -q "guardRequestBody(" "$FILE"; then
              echo "::error file=$FILE::a v1 write route does not run guardRequestBody (AGENT.md §1)"; fail=1
            fi
          done
          if grep -rniE "(secret|seed|mnemonic|privateKey)[A-Za-z]*\s*:" src/app/api/v1/ src/lib/api/v1.ts; then
            echo "::error::a v1 route or schema names a field for key material"; fail=1
          fi
          exit $fail

      # SPEC.md §3.2: the base reserve must be read from the ledger at runtime.
      # It is 0.5 XLM today and has changed before; a literal here would
      # under-fund every campaign the day it changes, and the SENDER pays.
      # Scoped to the two modules that do reserve arithmetic, and matched on
      # assignment so the prose in a doc comment does not trip it.
      - name: Base reserve is not hardcoded
        run: |
          if grep -nE "(reserve|Reserve)[A-Za-z]* *= *(new Decimal\()?['\"]?0\.5" \
               src/lib/stellar/horizon.ts src/lib/stellar/batch.ts; then
            echo "::error::base reserve is hardcoded (SPEC.md §3.2)"
            exit 1
          fi

      # AGENT.md §5.3 / §5.2. A CSP that allows inline script defeats the point
      # on /claim, which handles bearer secrets — so this is a static guard, not
      # something left to a reviewer noticing.
      - name: CSP allows no inline or eval
        run: |
          # Scoped to the CSP array itself. Scanning the whole file matches the
          # doc block, which names both directives while explaining their
          # absence — and a guard that fires on correct code gets disabled.
          if sed -n '/const csp = \[/,/\].join/p' src/middleware.ts \
               | grep -nE "unsafe-inline|unsafe-eval" | grep -v 'unsafe-hashes'; then
            echo "::error::CSP permits inline script or eval (AGENT.md §5.3)"
            exit 1
          fi
          echo "clean"

      # The demonstration endpoint must not outlive the real one. Without this,
      # a route that accepts arbitrary JSON quietly becomes permanent.
      # /api/echo was a stand-in so the seed guard was exercisable before the
      # real campaign endpoints existed. Those exist now, so it must stay gone:
      # an endpoint accepting arbitrary JSON should not outlive its purpose.
      - name: /api/echo does not come back
        run: |
          if [ -e "src/app/api/echo/route.ts" ]; then
            echo "::error::/api/echo was superseded by /api/campaigns/[id]/links and must not return"
            exit 1
          fi
          echo "clean"

      - name: Pages that need client JS are not prerendered
        run: |
          fail=0
          # Every page that renders a component, i.e. anything but a bare
          # placeholder, needs its nonce at request time.
          while IFS= read -r page; do
            grep -q "dynamic = 'force-dynamic'" "$page" && continue
            # A page importing nothing from components/ has no inline styles or
            # client behaviour to lose, so prerendering it is still safe.
            grep -q "from '@/components" "$page" || continue
            echo "::error::$page renders components but is prerendered; its inline scripts are CSP-refused and it never hydrates"
            fail=1
          done < <(find src/app -name 'page.tsx' -o -name 'layout.tsx' | sort)
          [ $fail -eq 0 ] && echo "clean"
          exit $fail

      # The inline-style half of the same CSP finding: style attributes are
      # governed by style-src-attr, which a nonce cannot satisfy, so they are
      # refused outright and the element renders unstyled while looking fine
      # in the DOM. Values belong in globals.css instead.
      - name: No inline style attributes
        run: |
          if grep -rn 'style={{' src/ --include='*.tsx'; then
            echo "::error::inline style attributes are refused by style-src 'self' - use a class in globals.css"
            exit 1
          fi
          echo "clean"

      - name: /claim gets no-referrer
        run: |
          if ! grep -q "no-referrer" src/middleware.ts; then
            echo "::error::/claim must send Referrer-Policy: no-referrer (SPEC.md §3.6)"
            exit 1
          fi
          echo "clean"

  secrets:
    name: secret-handling guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SPEC.md §10.6 — no schema column may store a seed, secret, or mnemonic.
      - name: Schema stores no secrets
        run: |
          if [ ! -f prisma/schema.prisma ]; then
            echo "no schema yet (#3) — skipping"; exit 0
          fi
          # Matches anywhere in the identifier, not just its start. An anchored
          # alternation passes `ephemeralSeed` and `senderSecret` — and given the
          # schema already has `ephemeralPublicKey`, a sibling named
          # `ephemeralSeed` is the most likely form this mistake takes.
          if grep -inE '^\s*\w*(secret|seed|mnemonic|private)\w*\s' prisma/schema.prisma; then
            echo "::error::a schema field name suggests secret storage (SPEC.md §4.1)"
            exit 1
          fi
          echo "clean"

      # AGENT.md §1. The literal snippet in AGENT.md greps for identifier NAMES,
      # which false-positives on the redaction allowlist and the leak-detection
      # regexes — the very code that prevents leaks. This checks the dangerous
      # OPERATION instead: extracting a seed from a keypair in application code.
      # scripts/ and tests/ are exempt and live outside src/ for that reason:
      # the testnet spike legitimately holds ephemeral seeds in memory, exactly
      # as the sender's browser does, and testing seed DETECTION requires a real
      # seed to detect. Excluding *.test.ts from a scan of src/ instead would
      # leave a file-naming hole in the guard.
      - name: No seed extraction in application code
        run: |
          # ONE exemption: src/lib/campaign/keygen.ts, which is the sender's
          # browser generating the ephemeral keys AGENT.md §1 says are
          # "generated in the sender's browser". The product cannot exist
          # without that call. It is exempt here and constrained by the next
          # step instead, which checks that nothing on the server can reach it —
          # an exemption that is verified rather than trusted.
          if grep -rnE '\.secret\(\)|rawSecretKey' src/ 2>/dev/null \
               | grep -v '^src/lib/campaign/keygen.ts:'; then
            echo "::error::application code extracts a secret seed (AGENT.md §1)"
            exit 1
          fi
          echo "clean"

      # What makes the exemption above safe. A seed generated in the browser is
      # the design; the same call reached from a route handler, a worker, or a
      # server component would put a seed in a response body or a log.
      #
      # The real enforcement is `import 'client-only'` at the top of keygen.ts:
      # that module throws under the react-server condition, so a server import
      # fails the BUILD by name rather than passing a text search. Verified
      # against a planted route handler — Turbopack refuses it.
      #
      # This step is the earlier, friendlier signal. It matches any spelling of
      # the module path, not one: the first version matched
      # '@/lib/campaign/keygen' but not './keygen', which is the natural way to
      # write it from inside that directory, and a planted server module using
      # the relative form went unseen.
      - name: Browser keygen is unreachable from the server
        run: |
          FAILED=0
          # Any import whose specifier ends in /keygen, aliased or relative.
          for FILE in $(grep -rlE "from ['\"][^'\"]*/keygen['\"]" src/ 2>/dev/null); do
            case "$FILE" in
              src/lib/campaign/keygen.ts) continue ;;
            esac
            # A type-only import is erased and reaches no runtime code.
            if ! grep -E "from ['\"][^'\"]*/keygen['\"]" "$FILE" | grep -qv 'import type'; then
              continue
            fi
            # Both quote styles, and anywhere in the preamble rather than the
            # first five lines — a licence header above the directive is not a
            # security finding, but it would read as a mysterious failure.
            if ! head -40 "$FILE" | grep -qE "^['\"]use client['\"]"; then
              echo "::error file=$FILE::imports browser keygen without 'use client' (AGENT.md §1)"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1
          echo "clean"

      # AGENT.md §5.5 — Next inlines NEXT_PUBLIC_* into the client bundle.
      # git grep searches tracked files natively. A recursive walk descends into
      # build output, and `ls-files | xargs grep` muddles exit codes across
      # batches — 123 means both "no match here" and "match elsewhere".
      - name: No secret-shaped NEXT_PUBLIC_ values committed
        run: |
          if git grep -nE 'NEXT_PUBLIC_[A-Z0-9_]*\s*=\s*.*S[A-Z2-7]{55}'; then
            echo "::error::a committed NEXT_PUBLIC_ value contains a Stellar secret seed"
            exit 1
          fi
          echo "clean"

      # Regression guard for the leak fixed in ff1beb7, closing the loop: rather
      # than hardcoding key names here, this checks that every secret-shaped key
      # in the env schema is classified in SECRET_ENV_KEYS, which the logger
      # derives its redact paths from. A seventh secret cannot be added without
      # a decision being recorded.
      - name: Every env secret is classified and redacted
        run: |
          # Keys matching a secret shape that are genuinely NOT secrets.
          # Adding to this list is a deliberate act, which is the point.
          NOT_SECRET="SPONSOR_PUBLIC_KEY APP_URL HORIZON_URL"

          registered=$(sed -n '/export const SECRET_ENV_KEYS/,/] as const/p' src/lib/config/env.ts \
                        | grep -oE "'[A-Z0-9_]+'" | tr -d "'")
          schema_keys=$(grep -oE '^  [A-Z][A-Z0-9_]*:' src/lib/config/env.ts | tr -d ' :')

          fail=0
          for key in $schema_keys; do
            case "$key" in
              *SECRET*|*PASSWORD*|*TOKEN*|*_KEY|*_URL) ;;
              *) continue ;;
            esac
            echo "$NOT_SECRET" | tr ' ' '\n' | grep -qx "$key" && continue
            if ! echo "$registered" | grep -qx "$key"; then
              echo "::error::$key looks like a secret but is not in SECRET_ENV_KEYS (src/lib/config/env.ts). Classify it, or add it to NOT_SECRET in this workflow."
              fail=1
            fi
          done

          # And the logger must actually SPREAD that list into redact.paths.
          # Grepping for the bare name is not enough — the import line alone
          # would satisfy it while the usage was gone.
          if ! grep -qE '\.\.\.SECRET_ENV_KEYS\s*\.flatMap' src/lib/config/logger.ts; then
            echo "::error::logger.ts no longer derives redact paths from SECRET_ENV_KEYS"
            fail=1
          fi
          exit $fail

      # Issue #53. Span attributes and metric labels are a log by another name,
      # and the logger's redaction does not see them. Two guards: every
      # attribute must pass through `safeAttributes` (so nothing in src/ may
      # set one directly), and the allowlist itself may not name anything
      # that identifies a link or a caller.
      - name: Span attributes and metric labels go through the allowlist
        run: |
          fail=0
          # The OpenTelemetry API is reached only through the two wrappers.
          if grep -rnE "\.(setAttribute|setAttributes|startSpan|startActiveSpan)\(" src/ | grep -vE '^src/lib/observability/tracing\.ts:'; then
            echo "::error::a span attribute is set outside lib/observability/tracing.ts — use withSpan/annotateSpan (docs/observability.md)"
            fail=1
          fi
          if grep -rnE "\.(createCounter|createHistogram|createGauge|createObservableGauge|createUpDownCounter)\(" src/ | grep -vE '^src/lib/observability/metrics\.ts:'; then
            echo "::error::a metric instrument is created outside lib/observability/metrics.ts"
            fail=1
          fi
          if grep -rnE "from '@opentelemetry/api'" src/ | grep -vE '^src/lib/observability/'; then
            echo "::error::@opentelemetry/api is imported outside lib/observability/"
            fail=1
          fi
          # The allowlist names no identifier of a link, a recipient or a caller.
          keys=$(sed -n '/export const ALLOWED_ATTRIBUTE_KEYS/,/] as const/p' src/lib/observability/attributes.ts | grep -oE "'[A-Za-z0-9_.]+'" | tr -d "'")
          for key in $keys; do
            case "$(echo "$key" | tr 'A-Z' 'a-z')" in
              *ephemeral*|*secret*|*seed*|*xdr*|*fragment*|*email*|*ip|*address*|*token*|*claimant*|*recipient*|*balance*)
                echo "::error::ALLOWED_ATTRIBUTE_KEYS contains '$key', which names link, recipient or caller data"
                fail=1 ;;
            esac
          done
          exit $fail

      # And the allowlist is exercised: a planted seed, fragment, envelope or
      # ephemeral key under every allowed key must be dropped.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Planted key material never survives safeAttributes
        run: pnpm vitest run tests/lib/observability
